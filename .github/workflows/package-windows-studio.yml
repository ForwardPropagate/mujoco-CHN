name: package-windows-studio

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/package-windows-studio.yml"
      - "src/experimental/**"
      - "src/**"
      - "include/**"
      - "CMakeLists.txt"
      - "cmake/**"

jobs:
  package:
    runs-on: windows-2025
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        shell: powershell
        run: |
          cmake -S . -B build `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_SYSTEM_VERSION=10.0.26100.0 `
            -DMUJOCO_BUILD_TESTS=OFF `
            -DMUJOCO_BUILD_EXAMPLES=OFF `
            -DMUJOCO_BUILD_SIMULATE=OFF `
            -DMUJOCO_BUILD_STUDIO=ON `
            -DMUJOCO_USE_FILAMENT=ON

      - name: Build Studio
        shell: powershell
        run: |
          cmake --build build --config Release --target mujoco_studio --parallel

      - name: Collect runtime files
        shell: powershell
        run: |
          $stage = Join-Path $env:RUNNER_TEMP "mujoco-studio-windows-x64"
          New-Item -ItemType Directory -Path $stage -Force | Out-Null

          $bin = Join-Path $PWD "build/bin/Release"
          Copy-Item (Join-Path $bin "mujoco_studio.exe") $stage -Force

          # Copy all generated DLLs next to the executable.
          Get-ChildItem $bin -Filter "*.dll" -File | ForEach-Object {
            Copy-Item $_.FullName $stage -Force
          }

          # VC runtime DLLs workaround (same as upstream CI).
          $msvcRoot = (Get-ChildItem -Directory -Path "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Redist\MSVC\14.*" |
            Sort-Object Name -Descending | Select-Object -First 1).FullName
          if ($msvcRoot) {
            Copy-Item (Join-Path $msvcRoot "x64\Microsoft.VC143.CRT\*.dll") $stage -Force
          }

          # Bundle common resources.
          if (Test-Path "model") {
            Copy-Item "model" (Join-Path $stage "model") -Recurse -Force
          }
          Copy-Item "LICENSE" $stage -Force
          Copy-Item "README.md" $stage -Force

      - name: Add launch helper
        shell: powershell
        run: |
          $stage = Join-Path $env:RUNNER_TEMP "mujoco-studio-windows-x64"
          $bat = Join-Path $stage "run_studio_zh.bat"
          $lines = @(
            '@echo off',
            'setlocal',
            'if not defined MUJOCO_CJK_FONT set MUJOCO_CJK_FONT=C:\Windows\Fonts\msyh.ttc',
            'start "" "%~dp0mujoco_studio.exe"'
          )
          $lines | Set-Content -Path $bat -Encoding ascii

      - name: Create zip
        shell: powershell
        run: |
          $stage = Join-Path $env:RUNNER_TEMP "mujoco-studio-windows-x64"
          $zip = Join-Path $env:RUNNER_TEMP "mujoco-studio-windows-x64.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path (Join-Path $stage "*") -DestinationPath $zip -CompressionLevel Optimal

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mujoco-studio-windows-x64
          path: ${{ runner.temp }}/mujoco-studio-windows-x64.zip
          if-no-files-found: error
